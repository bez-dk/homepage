# Local copy of the site: docker compose up -d
#   Site:            http://localhost:8080
#   Mail catcher:    http://localhost:8025
#   Database:        localhost:3306 (user/password from .env)

services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      DB_NAME: ${DB_NAME:-homepage}
      DB_USER: ${DB_USER:-homepage}
      DB_PASSWORD: ${DB_PASSWORD:-homepage}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    volumes:
      # Live code: edits show up on reload, no rebuild needed.
      - ./public:/var/www/html
      - ./docker/db-config.php:/var/www/html/includes/db-config.php:ro
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:-homepage}
      MARIADB_USER: ${DB_USER:-homepage}
      MARIADB_PASSWORD: ${DB_PASSWORD:-homepage}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAIL_PORT:-8025}:8025"

volumes:
  db-data:
